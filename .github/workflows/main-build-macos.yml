name: Rolling main build (macOS)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build app + agent (macos-arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build bundled agent wheel
        run: python -m pip wheel --no-deps -w agent-wheel ./peer_agent
      - name: Build standalone app
        run: pyinstaller --noconfirm --clean packaging/app.spec
      - name: Build standalone agent
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name llama-peer-agent \
            --paths peer_agent packaging/agent_entry.py
      - name: Package macOS
        run: |
          set -euo pipefail
          VERSION="0.0.0-main.${GITHUB_SHA::7}"
          mkdir -p dmg-app/LlamaRPCFarm dmg-agent/LlamaPeerAgent
          # app
          cp dist/llama-rpc-farm dmg-app/LlamaRPCFarm/llama-rpc-farm
          chmod 755 dmg-app/LlamaRPCFarm/llama-rpc-farm
          cat > dmg-app/LlamaRPCFarm/README.txt <<EOF
          Llama RPC Farm ${VERSION} (main rolling build)
          Run: ./llama-rpc-farm
          Open http://127.0.0.1:8199
          Runtime data: ~/Library/Application Support/LlamaRPCFarm
          EOF
          hdiutil create -volname "Llama RPC Farm" -srcfolder dmg-app \
            -ov -format UDZO "llama-rpc-farm_${VERSION}_macos-arm64.dmg"
          tar -czf "llama-rpc-farm_${VERSION}_macos-arm64.tar.gz" -C dist llama-rpc-farm
          # agent
          cp dist/llama-peer-agent dmg-agent/LlamaPeerAgent/llama-peer-agent
          chmod 755 dmg-agent/LlamaPeerAgent/llama-peer-agent
          cat > dmg-agent/LlamaPeerAgent/README.txt <<EOF
          Llama Peer Agent ${VERSION} (main rolling build)
          Run: ./llama-peer-agent --host 0.0.0.0 --port 8198
          Configure PEER_AGENT_TOKEN in the environment.
          EOF
          hdiutil create -volname "Llama Peer Agent" -srcfolder dmg-agent \
            -ov -format UDZO "llama-peer-agent_${VERSION}_macos-arm64.dmg"
          tar -czf "llama-peer-agent_${VERSION}_macos-arm64.tar.gz" -C dist llama-peer-agent
          shasum -a 256 *.dmg *.tar.gz > "llama-rpc-farm_${VERSION}_macos-arm64.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: main-macos-arm64
          path: |
            *.dmg
            *.tar.gz
            *.sha256

  publish:
    name: Publish
    needs: build
    uses: ./.github/workflows/publish-main-latest.yml
