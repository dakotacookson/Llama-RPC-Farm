name: Release agent

on:
  push:
    tags: ["agent-v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          want = tag.removeprefix("agent-v")
          py = tomllib.loads(pathlib.Path("peer_agent/pyproject.toml").read_text())
          got = py["project"]["version"]
          assert got == want, f"tag {tag} != package version {got}"
          init = pathlib.Path("peer_agent/llama_peer_agent/__init__.py").read_text()
          m = re.search(r'__version__\s*=\s*"([^"]+)"', init)
          assert m and m.group(1) == got, f"__version__ {m.group(1) if m else None} != {got}"
          print(f"agent {got} OK")
          PY
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build standalone binary
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name llama-peer-agent \
            --paths peer_agent packaging/agent_entry.py
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#agent-v}"
          mkdir -p pkg/DEBIAN pkg/usr/local/bin
          cp dist/llama-peer-agent pkg/usr/local/bin/llama-peer-agent
          chmod 755 pkg/usr/local/bin/llama-peer-agent
          cat > pkg/DEBIAN/control <<EOF
          Package: llama-rpc-farm-agent
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Llama RPC Farm contributors
          Description: Peer agent for Llama RPC Farm
          EOF
          dpkg-deb --build pkg "llama-rpc-farm-agent_${VERSION}_amd64.deb"
          tar -czf "llama-peer-agent_${VERSION}_linux-x64.tar.gz" -C dist llama-peer-agent
          sha256sum *.deb *.tar.gz > "llama-peer-agent_${VERSION}_linux-x64.sha256"
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#agent-v}"
          mkdir -p dmg/LlamaPeerAgent
          cp dist/llama-peer-agent dmg/LlamaPeerAgent/llama-peer-agent
          chmod 755 dmg/LlamaPeerAgent/llama-peer-agent
          cat > dmg/LlamaPeerAgent/README.txt <<EOF
          Llama Peer Agent ${VERSION}
          Run: ./llama-peer-agent --host 0.0.0.0 --port 8198
          Configure PEER_AGENT_TOKEN in the environment.
          EOF
          hdiutil create -volname "Llama Peer Agent" -srcfolder dmg \
            -ov -format UDZO "llama-peer-agent_${VERSION}_macos-arm64.dmg"
          tar -czf "llama-peer-agent_${VERSION}_macos-arm64.tar.gz" -C dist llama-peer-agent
          shasum -a 256 *.dmg *.tar.gz > "llama-peer-agent_${VERSION}_macos-arm64.sha256"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^agent-v',''
          Compress-Archive -Path dist\llama-peer-agent.exe `
            -DestinationPath "llama-peer-agent_${version}_windows-x64.zip" -Force
          (Get-FileHash "llama-peer-agent_${version}_windows-x64.zip" -Algorithm SHA256).Hash.ToLower() + "  llama-peer-agent_${version}_windows-x64.zip" |
            Set-Content "llama-peer-agent_${version}_windows-x64.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}
          path: |
            *.deb
            *.dmg
            *.zip
            *.tar.gz
            *.sha256

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Peer agent ${GITHUB_REF_NAME#agent-v}" \
            --generate-notes
