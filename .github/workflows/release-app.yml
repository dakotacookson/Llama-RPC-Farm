name: Release app

on:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Test before packaging
        if: runner.os == 'Linux'
        run: |
          python -m py_compile src/*.py scripts/*.py peer_agent/llama_peer_agent/*.py tests/*.py
          node --check ui/static/app.js
          bash -n run.sh restart-llama-swap.sh install.sh
          python -m pytest tests -q
      - name: Build bundled agent wheel
        run: python -m pip wheel --no-deps -w agent-wheel ./peer_agent
      - name: Build standalone app
        run: pyinstaller --noconfirm --clean packaging/app.spec
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#app-v}"
          mkdir -p pkg/DEBIAN pkg/usr/local/bin
          cp dist/llama-rpc-farm pkg/usr/local/bin/llama-rpc-farm
          chmod 755 pkg/usr/local/bin/llama-rpc-farm
          cat > pkg/DEBIAN/control <<EOF
          Package: llama-rpc-farm
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Llama RPC Farm contributors
          Description: Web UI and cluster manager for llama.cpp RPC farms
          EOF
          dpkg-deb --build pkg "llama-rpc-farm_${VERSION}_amd64.deb"
          tar -czf "llama-rpc-farm_${VERSION}_linux-x64.tar.gz" -C dist llama-rpc-farm
          sha256sum *.deb *.tar.gz > "llama-rpc-farm_${VERSION}_linux-x64.sha256"
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#app-v}"
          mkdir -p dmg/LlamaRPCFarm
          cp dist/llama-rpc-farm dmg/LlamaRPCFarm/llama-rpc-farm
          chmod 755 dmg/LlamaRPCFarm/llama-rpc-farm
          cat > dmg/LlamaRPCFarm/README.txt <<EOF
          Llama RPC Farm ${VERSION}
          Run: ./llama-rpc-farm
          Open http://127.0.0.1:8199
          Runtime data: ~/Library/Application Support/LlamaRPCFarm
          EOF
          hdiutil create -volname "Llama RPC Farm" -srcfolder dmg \
            -ov -format UDZO "llama-rpc-farm_${VERSION}_macos-arm64.dmg"
          tar -czf "llama-rpc-farm_${VERSION}_macos-arm64.tar.gz" -C dist llama-rpc-farm
          shasum -a 256 *.dmg *.tar.gz > "llama-rpc-farm_${VERSION}_macos-arm64.sha256"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^app-v',''
          Compress-Archive -Path dist\llama-rpc-farm.exe `
            -DestinationPath "llama-rpc-farm_${version}_windows-x64.zip" -Force
          (Get-FileHash "llama-rpc-farm_${version}_windows-x64.zip" -Algorithm SHA256).Hash.ToLower() + "  llama-rpc-farm_${version}_windows-x64.zip" |
            Set-Content "llama-rpc-farm_${version}_windows-x64.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: |
            *.deb
            *.dmg
            *.zip
            *.tar.gz
            *.sha256

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Llama RPC Farm ${GITHUB_REF_NAME#app-v}" \
            --generate-notes
