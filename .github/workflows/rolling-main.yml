name: Rolling main build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read VERSION
        run: |
          set -euo pipefail
          base=$(tr -d '[:space:]' < VERSION)
          test -n "$base" || { echo "VERSION file is empty" >&2; exit 1; }
          echo "version=${base}-main.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  linux:
    name: Build (Linux)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Test before packaging
        run: |
          python -m py_compile src/*.py scripts/*.py peer_agent/llama_peer_agent/*.py tests/*.py
          node --check ui/static/app.js
          bash -n run.sh restart-llama-swap.sh install.sh
          python -m pytest tests -q
      - name: Build bundled agent wheel
        run: python -m pip wheel --no-deps -w agent-wheel ./peer_agent
      - name: Build standalone app
        run: pyinstaller --noconfirm --clean packaging/app.spec
      - name: Build standalone agent
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name llama-peer-agent \
            --paths peer_agent packaging/agent_entry.py
      - name: Package Linux
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # app
          mkdir -p pkg-app/DEBIAN pkg-app/usr/local/bin
          cp dist/llama-rpc-farm pkg-app/usr/local/bin/llama-rpc-farm
          chmod 755 pkg-app/usr/local/bin/llama-rpc-farm
          cat > pkg-app/DEBIAN/control <<EOF
          Package: llama-rpc-farm
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: sshpass
          Maintainer: Llama RPC Farm contributors
          Description: Web UI and cluster manager for llama.cpp RPC farms
          EOF
          dpkg-deb --build pkg-app "llama-rpc-farm_${VERSION}_amd64.deb"
          # agent
          mkdir -p pkg-agent/DEBIAN pkg-agent/usr/local/bin
          cp dist/llama-peer-agent pkg-agent/usr/local/bin/llama-peer-agent
          chmod 755 pkg-agent/usr/local/bin/llama-peer-agent
          cat > pkg-agent/DEBIAN/control <<EOF
          Package: llama-rpc-farm-agent
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Llama RPC Farm contributors
          Description: Peer agent for Llama RPC Farm
          EOF
          dpkg-deb --build pkg-agent "llama-rpc-farm-agent_${VERSION}_amd64.deb"
          sha256sum *.deb > "llama-rpc-farm_${VERSION}_linux-x64.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            *.deb
            *.sha256

  macos:
    name: Build (macOS)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build bundled agent wheel
        run: python -m pip wheel --no-deps -w agent-wheel ./peer_agent
      - name: Build standalone app
        run: pyinstaller --noconfirm --clean packaging/app.spec
      - name: Build standalone agent
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name llama-peer-agent \
            --paths peer_agent packaging/agent_entry.py
      - name: Package macOS
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dmg-app/LlamaRPCFarm dmg-agent/LlamaPeerAgent
          # app
          cp dist/llama-rpc-farm dmg-app/LlamaRPCFarm/llama-rpc-farm
          chmod 755 dmg-app/LlamaRPCFarm/llama-rpc-farm
          cat > dmg-app/LlamaRPCFarm/README.txt <<EOF
          Llama RPC Farm ${VERSION}
          Run: ./llama-rpc-farm
          Open http://127.0.0.1:8199
          Runtime data: ~/Library/Application Support/LlamaRPCFarm
          EOF
          hdiutil create -volname "Llama RPC Farm" -srcfolder dmg-app \
            -ov -format UDZO "llama-rpc-farm_${VERSION}_macos-arm64.dmg"
          # agent
          cp dist/llama-peer-agent dmg-agent/LlamaPeerAgent/llama-peer-agent
          chmod 755 dmg-agent/LlamaPeerAgent/llama-peer-agent
          cat > dmg-agent/LlamaPeerAgent/README.txt <<EOF
          Llama Peer Agent ${VERSION}
          Run: ./llama-peer-agent --host 0.0.0.0 --port 8198
          Configure PEER_AGENT_TOKEN in the environment.
          EOF
          hdiutil create -volname "Llama Peer Agent" -srcfolder dmg-agent \
            -ov -format UDZO "llama-peer-agent_${VERSION}_macos-arm64.dmg"
          shasum -a 256 *.dmg > "llama-rpc-farm_${VERSION}_macos-arm64.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            *.dmg
            *.sha256

  windows:
    name: Build (Windows)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build bundled agent wheel
        run: python -m pip wheel --no-deps -w agent-wheel ./peer_agent
      - name: Build standalone app
        run: pyinstaller --noconfirm --clean packaging/app.spec
      - name: Build standalone agent
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name llama-peer-agent \
            --paths peer_agent packaging/agent_entry.py
      - name: Package Windows
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $version = $env:VERSION
          Copy-Item dist\llama-rpc-farm.exe "llama-rpc-farm_${version}_windows-x64.exe" -Force
          Copy-Item dist\llama-peer-agent.exe "llama-peer-agent_${version}_windows-x64.exe" -Force
          $files = @(
            "llama-rpc-farm_${version}_windows-x64.exe",
            "llama-peer-agent_${version}_windows-x64.exe"
          )
          $lines = foreach ($f in $files) {
            (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + "  " + $f
          }
          $lines | Set-Content "llama-rpc-farm_${version}_windows-x64.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            *.exe
            *.sha256

  publish:
    name: Publish main-latest
    needs: [prepare, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Replace main-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          SHA="$GITHUB_SHA"
          PREV=$(gh api "repos/${REPO}/git/ref/tags/main-latest" --jq .object.sha 2>/dev/null || true)
          if [ -n "$PREV" ] && [ "$PREV" != "$SHA" ]; then
            COMPARE="https://github.com/${REPO}/compare/${PREV}...${SHA}"
            gh api "repos/${REPO}/compare/${PREV}...${SHA}" \
              --jq '.commits[0:30][] | "- " + (.commit.message | split("\n")[0]) + " (`" + .sha[0:7] + "`)"' \
              > changes.md || true
          else
            COMPARE="https://github.com/${REPO}/commits/main"
            : > changes.md
          fi
          [ -s changes.md ] || echo "- No new commits since the previous rolling build." > changes.md

          export REPO SHA COMPARE

          python3 - <<'PY'
          import datetime, os, pathlib
          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          short = sha[:7]
          compare = os.environ["COMPARE"]
          changes = pathlib.Path("changes.md").read_text().strip()
          notes = f"""# Llama RPC Farm — main rolling build

          Automatic prerelease snapshot of `main`. Not a versioned, supported release.

          - **Version:** `{version}`
          - **Commit:** [`{short}`](https://github.com/{repo}/commit/{sha})
          - **Built:** {datetime.datetime.now(datetime.timezone.utc):%Y-%m-%d %H:%M UTC}
          - **Compare:** {compare}

          ## Changes since the previous roll

          {changes}

          ## Downloads

          ### App — `llama-rpc-farm`

          - **Linux:** `llama-rpc-farm_{version}_amd64.deb`
          - **macOS (Apple Silicon):** `llama-rpc-farm_{version}_macos-arm64.dmg`
          - **Windows:** `llama-rpc-farm_{version}_windows-x64.exe`

          ### Peer agent — `llama-peer-agent`

          - **Linux:** `llama-rpc-farm-agent_{version}_amd64.deb`
          - **macOS (Apple Silicon):** `llama-peer-agent_{version}_macos-arm64.dmg`
          - **Windows:** `llama-peer-agent_{version}_windows-x64.exe`

          Each platform uploads a matching `.sha256` checksum file.

          ## Quick start

          1. Download the archive for your platform (or the `.deb` on Linux).
          2. Start the app: `./llama-rpc-farm` (Linux/macOS) or `llama-rpc-farm.exe` (Windows).
          3. Open http://127.0.0.1:8199 and follow `docs/setup.md`.

          Binaries are unsigned: on macOS use **right-click → Open** the first time.
          """
          pathlib.Path("release-notes.md").write_text(notes)
          PY

          TITLE="Llama RPC Farm (main rolling)"
          if gh release view main-latest >/dev/null 2>&1; then
            gh release delete main-latest --yes
          fi
          git tag -f main-latest "$SHA"
          git push -f origin refs/tags/main-latest
          gh release create main-latest release-assets/* \
            --prerelease \
            --title "$TITLE" \
            --notes-file release-notes.md
