name: Rolling main build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read VERSION
        run: |
          set -euo pipefail
          base=$(tr -d '[:space:]' < VERSION)
          test -n "$base" || { echo "VERSION file is empty" >&2; exit 1; }
          echo "version=${base}-main.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  linux:
    name: Build (Linux)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Test before packaging
        run: |
          python -m py_compile src/*.py scripts/*.py peer_agent/llama_peer_agent/*.py tests/*.py
          node --check ui/static/app.js
          bash -n run.sh restart-llama-swap.sh install.sh
          python -m pytest tests -q
      - name: Build bundled agent wheel
        run: python -m pip wheel --no-deps -w agent-wheel ./peer_agent
      - name: Build standalone app
        run: pyinstaller --noconfirm --clean packaging/app.spec
      - name: Build standalone agent
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name llama-peer-agent \
            --hidden-import llama_peer_agent.selfservice \
            --paths peer_agent packaging/agent_entry.py
      - name: Package Linux
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # app
          mkdir -p pkg-app/DEBIAN pkg-app/usr/local/bin
          cp dist/llama-rpc-farm pkg-app/usr/local/bin/llama-rpc-farm
          chmod 755 pkg-app/usr/local/bin/llama-rpc-farm
          cat > pkg-app/DEBIAN/control <<EOF
          Package: llama-rpc-farm
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Llama RPC Farm contributors
          Description: Web UI and cluster manager for llama.cpp RPC farms
          EOF
          mkdir -p pkg-app/usr/lib/systemd/user
          cat > pkg-app/usr/lib/systemd/user/llama-rpc-farm.service <<'UNIT'
          [Unit]
          Description=Llama RPC Farm
          After=network-online.target
          Wants=network-online.target

          [Service]
          ExecStart=/usr/local/bin/llama-rpc-farm
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=default.target
          UNIT
          cat > pkg-app/DEBIAN/postinst <<'POST'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl --global enable llama-rpc-farm.service || true
            users=$(getent passwd | awk -F: '$3>=1000 && $3<65534 {print $1}')
            if [ "$(echo "$users" | wc -w)" -eq 1 ]; then
              loginctl enable-linger "$users" || true
            fi
          fi
          exit 0
          POST
          chmod 755 pkg-app/DEBIAN/postinst
          dpkg-deb --build pkg-app "llama-rpc-farm_${VERSION}_amd64.deb"
          # agent
          mkdir -p pkg-agent/DEBIAN pkg-agent/usr/local/bin
          cp dist/llama-peer-agent pkg-agent/usr/local/bin/llama-peer-agent
          chmod 755 pkg-agent/usr/local/bin/llama-peer-agent
          cat > pkg-agent/DEBIAN/control <<EOF
          Package: llama-rpc-farm-agent
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Llama RPC Farm contributors
          Description: Peer agent for Llama RPC Farm
          EOF
          mkdir -p pkg-agent/usr/lib/systemd/user
          cat > pkg-agent/usr/lib/systemd/user/llama-peer-agent.service <<'UNIT'
          [Unit]
          Description=Llama RPC Farm peer agent
          After=network-online.target
          Wants=network-online.target

          [Service]
          ExecStart=/usr/local/bin/llama-peer-agent --host 0.0.0.0 --port 8198
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target
          UNIT
          cat > pkg-agent/DEBIAN/postinst <<'POST'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl --global enable llama-peer-agent.service || true
            users=$(getent passwd | awk -F: '$3>=1000 && $3<65534 {print $1}')
            if [ "$(echo "$users" | wc -w)" -eq 1 ]; then
              loginctl enable-linger "$users" || true
            fi
          fi
          exit 0
          POST
          chmod 755 pkg-agent/DEBIAN/postinst
          dpkg-deb --build pkg-agent "llama-rpc-farm-agent_${VERSION}_amd64.deb"
          sha256sum *.deb > "llama-rpc-farm_${VERSION}_linux-x64.sha256"
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ runner.os }}-qwen2.5-0.5b-q4
      - name: E2E - install .deb + tiny model load
        env:
          HF_HOME: ${{ github.workspace }}/.hf-cache
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get install -y ./llama-rpc-farm_*.deb ./llama-rpc-farm-agent_*.deb
          python tests/e2e/single_node.py \
            --app /usr/local/bin/llama-rpc-farm \
            --agent /usr/local/bin/llama-peer-agent
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            *.deb
            *.sha256

  macos:
    name: Build (macOS)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build bundled agent wheel
        run: python -m pip wheel --no-deps -w agent-wheel ./peer_agent
      - name: Build standalone app
        run: pyinstaller --noconfirm --clean packaging/app.spec
      - name: Build standalone agent
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name llama-peer-agent \
            --hidden-import llama_peer_agent.selfservice \
            --paths peer_agent packaging/agent_entry.py
      - name: Sign macOS binaries (if configured)
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_APP_SIGN_ID: ${{ secrets.MACOS_APP_SIGN_ID }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then
            echo "No macOS signing certificate configured — unsigned build."
            exit 0
          fi
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions build.keychain
          for bin in dist/llama-rpc-farm dist/llama-peer-agent; do
            codesign --force --timestamp --options runtime \
              --entitlements packaging/entitlements.plist \
              --sign "$MACOS_APP_SIGN_ID" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
      - name: Package macOS (pkg installers)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # app .pkg
          mkdir -p pkgroot-app/usr/local/bin scripts-app
          cp dist/llama-rpc-farm pkgroot-app/usr/local/bin/llama-rpc-farm
          chmod 755 pkgroot-app/usr/local/bin/llama-rpc-farm
          cat > scripts-app/postinstall <<'POST'
          #!/bin/bash
          set -e
          BIN=/usr/local/bin/llama-rpc-farm
          LABEL=com.llamarpc.farm.app
          USER_NAME=$(stat -f%Su /dev/console)
          if [ -z "$USER_NAME" ] || [ "$USER_NAME" = "root" ] || [ "$USER_NAME" = "loginwindow" ]; then exit 0; fi
          USER_ID=$(id -u "$USER_NAME")
          USER_HOME=$(dscl . -read /Users/"$USER_NAME" NFSHomeDirectory | awk '{print $2}')
          sudo -u "$USER_NAME" "$BIN" --install-service || true
          launchctl asuser "$USER_ID" launchctl bootstrap "gui/$USER_ID" "$USER_HOME/Library/LaunchAgents/$LABEL.plist" 2>/dev/null || true
          exit 0
          POST
          chmod 755 scripts-app/postinstall
          pkgbuild --root pkgroot-app --identifier com.llamarpc.farm.app \
            --version "${VERSION%%-*}" --scripts scripts-app \
            "llama-rpc-farm_${VERSION}_macos-arm64.pkg"
          # agent .pkg
          mkdir -p pkgroot-agent/usr/local/bin scripts-agent
          cp dist/llama-peer-agent pkgroot-agent/usr/local/bin/llama-peer-agent
          chmod 755 pkgroot-agent/usr/local/bin/llama-peer-agent
          cat > scripts-agent/postinstall <<'POST'
          #!/bin/bash
          set -e
          BIN=/usr/local/bin/llama-peer-agent
          LABEL=com.llamarpc.farm.agent
          USER_NAME=$(stat -f%Su /dev/console)
          if [ -z "$USER_NAME" ] || [ "$USER_NAME" = "root" ] || [ "$USER_NAME" = "loginwindow" ]; then exit 0; fi
          USER_ID=$(id -u "$USER_NAME")
          USER_HOME=$(dscl . -read /Users/"$USER_NAME" NFSHomeDirectory | awk '{print $2}')
          sudo -u "$USER_NAME" "$BIN" --install-service || true
          launchctl asuser "$USER_ID" launchctl bootstrap "gui/$USER_ID" "$USER_HOME/Library/LaunchAgents/$LABEL.plist" 2>/dev/null || true
          exit 0
          POST
          chmod 755 scripts-agent/postinstall
          pkgbuild --root pkgroot-agent --identifier com.llamarpc.farm.agent \
            --version "${VERSION%%-*}" --scripts scripts-agent \
            "llama-peer-agent_${VERSION}_macos-arm64.pkg"
      - name: Sign + notarize macOS pkgs (if configured)
        env:
          MACOS_INSTALLER_SIGN_ID: ${{ secrets.MACOS_INSTALLER_SIGN_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${MACOS_INSTALLER_SIGN_ID:-}" ]; then
            for pkg in *.pkg; do
              productsign --sign "$MACOS_INSTALLER_SIGN_ID" "$pkg" "signed-$pkg"
              mv "signed-$pkg" "$pkg"
            done
          else
            echo "No Developer ID Installer cert — pkg left unsigned."
          fi
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] \
             && [ -n "${APPLE_APP_PASSWORD:-}" ]; then
            for pkg in *.pkg; do
              xcrun notarytool submit "$pkg" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" --wait
              xcrun stapler staple "$pkg"
            done
          else
            echo "No Apple notarization credentials — not skipping signing, only notarization."
          fi
          shasum -a 256 *.pkg > "llama-rpc-farm_${VERSION}_macos-arm64.sha256"
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ runner.os }}-qwen2.5-0.5b-q4
      - name: E2E - install .pkg + tiny model load
        env:
          HF_HOME: ${{ github.workspace }}/.hf-cache
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo installer -pkg llama-rpc-farm_*.pkg -target /
          sudo installer -pkg llama-peer-agent_*.pkg -target /
          # the pkg postinstall may have bootstrapped LaunchAgents; stop them
          launchctl bootout gui/$(id -u)/com.llamarpc.farm.app 2>/dev/null || true
          launchctl bootout gui/$(id -u)/com.llamarpc.farm.agent 2>/dev/null || true
          killall llama-rpc-farm llama-peer-agent 2>/dev/null || true
          python tests/e2e/single_node.py \
            --app /usr/local/bin/llama-rpc-farm \
            --agent /usr/local/bin/llama-peer-agent
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            *.pkg
            *.sha256

  windows:
    name: Build (Windows)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build bundled agent wheel
        run: python -m pip wheel --no-deps -w agent-wheel ./peer_agent
      - name: Build standalone app
        run: pyinstaller --noconfirm --clean packaging/app.spec
      - name: Build standalone agent
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name llama-peer-agent \
            --hidden-import llama_peer_agent.selfservice \
            --paths peer_agent packaging/agent_entry.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Sign Windows binaries (if configured)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "No Windows signing certificate configured - unsigned build."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          foreach ($f in @("dist\llama-rpc-farm.exe", "dist\llama-peer-agent.exe")) {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $f
            if ($LASTEXITCODE -ne 0) { throw "sign failed: $f" }
          }
      - name: Package Windows (setup installers)
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $env:APP_VERSION = $env:VERSION
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc packaging\app.iss
          if ($LASTEXITCODE -ne 0) { throw "app installer build failed" }
          & $iscc packaging\agent.iss
          if ($LASTEXITCODE -ne 0) { throw "agent installer build failed" }
      - name: Sign Windows installers + checksums (if configured)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            foreach ($f in (Get-ChildItem dist\*setup.exe)) {
              & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
                /tr http://timestamp.digicert.com /td sha256 /fd sha256 $f.FullName
              if ($LASTEXITCODE -ne 0) { throw "sign failed: $($f.Name)" }
            }
          } else {
            Write-Host "Installer left unsigned (no cert)."
          }
          $files = Get-ChildItem dist\*setup.exe
          $lines = foreach ($f in $files) {
            (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $f.Name
          }
          $lines | Set-Content "llama-rpc-farm_${env:VERSION}_windows-x64.sha256"
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ runner.os }}-qwen2.5-0.5b-q4
      - name: E2E - install setup.exe + tiny model load
        shell: pwsh
        env:
          HF_HOME: ${{ github.workspace }}/.hf-cache
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $app = Get-ChildItem dist\llama-rpc-farm_*_windows-x64-setup.exe | Select-Object -First 1
          $agent = Get-ChildItem dist\llama-peer-agent_*_windows-x64-setup.exe | Select-Object -First 1
          if (-not $app -or -not $agent) { throw "Windows installer assets missing from dist\" }
          Start-Process -Wait -FilePath $app.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          Start-Process -Wait -FilePath $agent.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          schtasks /End /TN LlamaRPCFarm 2>$null
          schtasks /End /TN LlamaPeerAgent 2>$null
          Get-Process llama-rpc-farm,llama-peer-agent -ErrorAction SilentlyContinue | Stop-Process -Force
          python tests/e2e/single_node.py `
            --app "C:\Program Files\LlamaRPCFarm\llama-rpc-farm.exe" `
            --agent "C:\Program Files\LlamaRPCFarmAgent\llama-peer-agent.exe"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*setup.exe
            *.sha256

  publish:
    name: Publish main-latest
    needs: [prepare, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Replace main-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          SHA="$GITHUB_SHA"
          PREV=$(gh api "repos/${REPO}/git/ref/tags/main-latest" --jq .object.sha 2>/dev/null || true)
          # The tag may not exist on the first run; gh can also print an
          # error JSON body on stdout. Only accept a real 40-char commit SHA.
          if ! printf '%s' "$PREV" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            PREV=""
          fi
          if [ -n "$PREV" ] && [ "$PREV" != "$SHA" ]; then
            COMPARE="https://github.com/${REPO}/compare/${PREV}...${SHA}"
            gh api "repos/${REPO}/compare/${PREV}...${SHA}" \
              --jq '.commits[0:30][] | "- " + (.commit.message | split("\n")[0]) + " (`" + .sha[0:7] + "`)"' \
              > changes.md 2>/dev/null || : > changes.md
          else
            COMPARE="https://github.com/${REPO}/commits/main"
            : > changes.md
          fi
          [ -s changes.md ] || echo "- No new commits since the previous rolling build." > changes.md

          export REPO SHA COMPARE

          python3 - <<'PY'
          import datetime, os, pathlib
          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          short = sha[:7]
          compare = os.environ["COMPARE"]
          changes = pathlib.Path("changes.md").read_text().strip()
          notes = f"""# Llama RPC Farm — main rolling build

          Automatic prerelease snapshot of `main`. Not a versioned, supported release.

          - **Version:** `{version}`
          - **Commit:** [`{short}`](https://github.com/{repo}/commit/{sha})
          - **Built:** {datetime.datetime.now(datetime.timezone.utc):%Y-%m-%d %H:%M UTC}
          - **Compare:** {compare}

          ## Changes since the previous roll

          {changes}

          ## Downloads

          ### App — `llama-rpc-farm`

          - **Linux:** `llama-rpc-farm_{version}_amd64.deb`
          - **macOS (Apple Silicon):** `llama-rpc-farm_{version}_macos-arm64.pkg`
          - **Windows:** `llama-rpc-farm_{version}_windows-x64-setup.exe`

          ### Peer agent — `llama-peer-agent`

          - **Linux:** `llama-rpc-farm-agent_{version}_amd64.deb`
          - **macOS (Apple Silicon):** `llama-peer-agent_{version}_macos-arm64.pkg`
          - **Windows:** `llama-peer-agent_{version}_windows-x64-setup.exe`

          Each platform uploads a matching `.sha256` checksum file.

          ## Quick start

          1. Download and run the installer for your platform.
          2. The installer registers login auto-start; launch the app from your menu/shortcut if it is not already open.
          3. Open http://127.0.0.1:8199 and follow `docs/setup.md`.

          Binaries are unsigned: on macOS use **right-click → Open** the first time.
          """
          pathlib.Path("release-notes.md").write_text(notes)
          PY

          TITLE="Llama RPC Farm (main rolling)"
          if gh release view main-latest >/dev/null 2>&1; then
            gh release delete main-latest --yes
          fi
          git tag -f main-latest "$SHA"
          git push -f origin refs/tags/main-latest
          # download-artifact preserves platform subdirs (e.g. dist/), so
          # collect FILES only — passing release-assets/* used to hand
          # gh a directory and fail with "is a directory".
          mapfile -d '' ASSETS < <(find release-assets -type f -print0)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "no release assets found under release-assets/" >&2
            exit 1
          fi
          gh release create main-latest "${ASSETS[@]}" \
            --prerelease \
            --title "$TITLE" \
            --notes-file release-notes.md
