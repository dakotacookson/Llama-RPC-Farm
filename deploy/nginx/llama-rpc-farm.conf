# Llama RPC Farm behind nginx (TLS termination).
#
# Replace farm.example.com / api.farm.example.com and certificate paths.
# The app must trust loopback as a proxy (default) and should run with:
#   FARM_TRUSTED_PROXIES=127.0.0.1
#   FARM_REQUIRE_AUTH=1
#   FARM_GATEWAY_REQUIRE_KEYS=1
#   FARM_COOKIE_SECURE=1
#
# Never proxy raw RPC ports here. With rpc_security: mtls, only the
# per-peer TCP 5399 mTLS tunnel may be exposed (prefer WireGuard).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name farm.example.com;

    ssl_certificate     /etc/ssl/farm/fullchain.pem;
    ssl_certificate_key /etc/ssl/farm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 0;
    proxy_read_timeout 7200;
    proxy_send_timeout 7200;

    location / {
        proxy_pass http://127.0.0.1:8199;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl http2;
    server_name api.farm.example.com;

    ssl_certificate     /etc/ssl/farm/fullchain.pem;
    ssl_certificate_key /etc/ssl/farm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 0;
    proxy_read_timeout 7200;
    proxy_send_timeout 7200;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / streaming: never buffer model output
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
    }
}
